name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build & upload binaries
    strategy:
      fail-fast: false
      matrix:
        target:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin,      os: macos-latest }
          - { target: aarch64-apple-darwin,     os: macos-latest }
          - { target: x86_64-pc-windows-msvc,   os: windows-latest }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
      - working-directory: compiler
        run: cargo build --release --target ${{ matrix.target.target }} --locked
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          OUT=ezhtml-${{ matrix.target.target }}
          mkdir -p artifacts/$OUT
          case "${{ matrix.target.target }}" in
            x86_64-pc-windows-msvc)
              cp compiler/target/${{ matrix.target.target }}/release/ezhtml.exe artifacts/$OUT/ezhtml.exe
              ;;
            *)
              cp compiler/target/${{ matrix.target.target }}/release/ezhtml artifacts/$OUT/ezhtml
              chmod +x artifacts/$OUT/ezhtml
              ;;
          esac
          tar -C artifacts -czf artifacts/$OUT.tar.gz $OUT
          echo "ASSET=artifacts/$OUT.tar.gz" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

  publish-vsix:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: vscode-extension
        run: |
          npm install
          npm run build
          npx vsce package --no-dependencies
      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
