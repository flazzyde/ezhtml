name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-compiler:
    name: Compiler (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build compiler
        working-directory: compiler
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi
        shell: bash

      - name: Package compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          OUT="ezhtml-${GITHUB_REF_NAME}-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              cp "compiler/target/${{ matrix.target }}/release/ezhtml.exe" "artifacts/${OUT}.exe"
              7z a "artifacts/${OUT}.zip" "artifacts/${OUT}.exe"
              rm "artifacts/${OUT}.exe"
              ;;
            *)
              cp "compiler/target/${{ matrix.target }}/release/ezhtml" "artifacts/${OUT}"
              chmod +x "artifacts/${OUT}"
              tar -C artifacts -czf "artifacts/${OUT}.tar.gz" "${OUT}"
              ;;
          esac

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.target }}
          path: artifacts/ezhtml-*
          if-no-files-found: error

  build-editor:
    name: Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: AppImage
          - os: macos-latest
            ext: dmg
          - os: windows-latest
            ext: exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package editor
        working-directory: editor
        run: |
          npm install
          npm run build
          npm run package

      - name: Rename editor artifact
        shell: bash
        working-directory: editor/dist
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          VERSION_NO_V="${VERSION#v}"
          SRC="ezhtml-editor-${VERSION_NO_V}.${{ matrix.ext }}"
          DST="ezhtml-editor-${VERSION}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" == "exe" ]; then
            DST="ezhtml-editor-${VERSION}-setup.exe"
          fi
          mv "${SRC}" "${DST}"

      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.os }}
          path: editor/dist/ezhtml-editor-${{ github.ref_name }}*.${{ matrix.ext }}
          if-no-files-found: error

  build-vsix:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build extension
        working-directory: vscode-extension
        run: |
          npm install
          npm run build
          npx vsce package --no-dependencies

      - name: Rename vsix
        working-directory: vscode-extension
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mv "ezhtml-${VERSION#v}.vsix" "ezhtml-vscode-${VERSION}.vsix"

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/ezhtml-vscode-*.vsix
          if-no-files-found: error

  publish-release:
    name: Publish release assets + SHA256SUMS
    needs: [build-compiler, build-editor, build-vsix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
