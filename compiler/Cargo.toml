[package]
name = "ezhtml"
version = "1.0.0"
edition = "2021"
description = "Modern indentation-based markup language that compiles to HTML5"
license = "MIT"
repository = "https://github.com/ezhtml/ezhtml"
readme = "README.md"
keywords = ["markup", "html", "compiler", "ezhtml", "indentation"]
categories = ["command-line-utilities", "compilers", "web-programming"]
authors = ["flazzyde <ezhtml@flazzy.de>"]

[lib]
name = "ezhtml"
path = "src/lib.rs"

[[bin]]
name = "ezhtml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
# `colored 2.1` pulls in `is-terminal 0.4` → `rustix 0.38`, which fails to
# build on glibc 2.39+ (Ubuntu 24.04 / `ubuntu-latest`) and on Apple Silicon
# runners with the newer macOS SDK (`macos-latest` → aarch64-apple-darwin).
# Disabling default features removes the broken `is-terminal` dependency;
# ANSI styling methods like `.green()` / `.bold()` keep working.
colored = { version = "2.1", default-features = false }

[dev-dependencies]
insta = { version = "1.39", features = ["yaml"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
