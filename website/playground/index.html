<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EZHTML Playground</title>
  <link rel="stylesheet" href="./playground.css">
</head>
<body>
<header class="pg-header">
  <div class="brand">⚡ EZHTML Playground</div>
  <div class="actions">
    <button id="export">Export HTML</button>
    <button id="reset">Reset</button>
    <a href="/" class="home">← Back</a>
  </div>
</header>
<main class="pg-main">
  <textarea id="source" spellcheck="false" aria-label="EZHTML source"></textarea>
  <iframe id="preview" title="Preview"></iframe>
</main>
<footer class="pg-status" id="status">Ready.</footer>
<script src="./playground.js" type="module"></script>
</body>
</html>
